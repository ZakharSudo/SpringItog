server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Наш секретный ключ для подписи токенов (минимум 32 символа)
jwt:
  secret: mySuperSecretKeyForBookingSystem1234567890!
  expiration-ms: 3600000 # 1 час (в миллисекундах)