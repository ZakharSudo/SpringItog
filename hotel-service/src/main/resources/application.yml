server:
  port: 8081

spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hoteldb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true  # <--- ДОБАВИТЬ ЭТО
    hibernate:
      ddl-auto: update
    show-sql: true
jwt:
  secret: mySuperSecretKeyForBookingSystem1234567890!